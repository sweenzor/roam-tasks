services:
  roam-tasks:
    build: .
    container_name: roam-tasks
    ports:
      - "5174:5174"
    environment:
      HOST: 0.0.0.0
      PORT: 5174
      ROAM_DEFAULT_GRAPH: personal-graph
      ROAM_LOCAL_API_HOST: host.docker.internal
    volumes:
      - ${HOME}/.roam-tools.json:/home/node/.roam-tools.json:ro
      - ${HOME}/.roam-local-api.json:/home/node/.roam-local-api.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
