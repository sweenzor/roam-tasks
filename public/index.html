<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roam Tasks</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#101010">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <main class="workspace">
        <header class="view-bar">
          <nav class="view-list" aria-label="Task views">
            <button class="view-button active" data-view="inbox" type="button">
              <span>Inbox</span><strong id="countInbox">0</strong>
            </button>
            <button class="view-button" data-view="next" type="button">
              <span>Next</span><strong id="countNext">0</strong>
            </button>
            <button class="view-button" data-view="waiting" type="button">
              <span>Waiting</span><strong id="countWaiting">0</strong>
            </button>
            <button class="view-button" data-view="scheduled" type="button">
              <span>Scheduled</span><strong id="countScheduled">0</strong>
            </button>
            <button class="view-button" data-view="someday" type="button">
              <span>Someday</span><strong id="countSomeday">0</strong>
            </button>
            <button class="view-button" data-view="projects" type="button">
              <span>Projects</span><strong id="countProjects">0</strong>
            </button>
            <button class="view-button" data-view="review" type="button">
              <span>Review</span><strong id="countReview">0</strong>
            </button>
          </nav>
          <button id="refreshButton" class="icon-button sync-button" type="button" title="Refresh tasks" aria-label="Refresh tasks">↻</button>
        </header>

        <header class="toolbar">
          <form id="addForm" class="quick-add">
            <input id="taskInput" class="input task-input" autocomplete="off" placeholder="Capture task" type="text">
            <input id="pageInput" class="input page-input" autocomplete="off" placeholder="Project" type="text">
            <button class="primary-button" type="submit" title="Add task">+</button>
          </form>

          <div class="tool-actions">
            <input id="searchInput" class="input search-input" autocomplete="off" placeholder="Search" type="search">
            <input id="sinceInput" class="input since-input hidden" title="Show tasks since date" type="date">
            <label id="completedFilter" class="completed-filter">
              <input id="showCompletedToggle" type="checkbox">
              <span>Show completed</span>
            </label>
            <label id="compactFilter" class="compact-filter">
              <input id="compactToggle" type="checkbox">
              <span>Compact view</span>
            </label>
            <select id="sortSelect" class="input sort-input" title="Sort tasks">
              <option value="recent">Recent</option>
              <option value="due">Due</option>
              <option value="project">Project</option>
              <option value="updated">Updated</option>
            </select>
          </div>
        </header>

        <section id="bulkBar" class="bulk-bar hidden" aria-label="Bulk task actions">
          <span id="bulkCount" class="bulk-count">0 selected</span>
          <button id="selectVisibleButton" class="secondary-button" type="button">Select visible</button>
          <select id="bulkStatusInput" class="input bulk-status-input" title="Move selected tasks">
            <option value="">Move to...</option>
            <option value="inbox">Inbox</option>
            <option value="next">Next</option>
            <option value="waiting">Waiting</option>
            <option value="scheduled">Scheduled</option>
            <option value="someday">Someday</option>
          </select>
          <input id="bulkProjectInput" class="input bulk-project-input" autocomplete="off" placeholder="Project" type="text">
          <input id="bulkContextInput" class="input bulk-context-input" autocomplete="off" placeholder="@context" type="text">
          <input id="bulkDateInput" class="input bulk-date-input" title="Scheduled date" type="date">
          <input id="bulkWaitingInput" class="input bulk-waiting-input" autocomplete="off" placeholder="Waiting for" type="text">
          <button id="bulkApplyButton" class="secondary-button" type="button">Apply</button>
          <button id="bulkClearButton" class="icon-button" type="button" title="Clear selection" aria-label="Clear selection">×</button>
        </section>

        <section id="setupPanel" class="setup-panel hidden">
          <h2>Connect Roam Desktop</h2>
          <p>No graph token was found. Run <code>npx @roam-research/roam-mcp connect</code>, approve the token in Roam Desktop, then refresh this page.</p>
        </section>

        <section id="localStoreNotice" class="store-notice hidden" aria-live="polite">
          <h2>Local sandbox recovered</h2>
          <div id="localStoreNoticeBody" class="store-notice-body"></div>
        </section>

        <section class="list-head">
          <h2 id="viewTitle">Inbox</h2>
        </section>

        <div id="taskList" class="task-list" aria-live="polite"></div>
        <div id="shortcutHint" class="shortcut-hint hidden" aria-live="polite"></div>
      </main>
    </div>

    <template id="taskTemplate">
      <article class="task-row" tabindex="0">
        <button class="check-button" type="button" title="Toggle done"></button>
        <div class="task-main">
          <div class="task-title"></div>
          <input class="input edit-input hidden" type="text">
          <div class="task-meta"></div>
        </div>
        <div class="task-actions">
          <a class="icon-button open-link" title="Open in Roam">↗</a>
          <button class="icon-button delete-button" type="button" title="Delete">×</button>
        </div>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
